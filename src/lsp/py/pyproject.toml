[project]
name = "vnoc-lsp-python"
version = "0.1.0"
description = "Python language driver (JSON-RPC) for v-noc"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "fastapi-jsonrpc>=3.4.1",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.0",
    "jedi>=0.19.2",
    "parso>=0.8.5",
    "libcst>=1.7.0",
]

[project.scripts]
vnoc-lsp-python = "vnoc_lsp_python.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vnoc_lsp_python"]
