[project]
name = "backend"
version = "0.1.0"
dependencies = [
  "fastapi",
  "gunicorn>=23.0.0",
  "uvicorn",
  "python-arango",
  "pydantic",
  "pydantic-settings",
  "pytest-mock>=3.14.1",
  "pathspec>=0.12.1",
  "astpretty>=3.0.0",
  "loguru>=0.7.3",
  "watchdog>=6.0.0",
  "fastapi-jsonrpc>=3.4.1",
  "vn-logger",
  "httpx>=0.28.1",
  "libcst>=1.7.0",
  "platformdirs>=4.5.0",
  "sqlalchemy>=2.0.44",
  "parso>=0.8.5",
  "kuzu>=0.11.3",
  "jedi>=0.19.2",
  "pyvis>=0.3.2",
  "python-socketio>=5.15.0",
  "python-arango-async>=1.0.3",
  "pytest-asyncio>=1.1.0",
  "aiofiles>=25.1.0",
  "asgi-lifespan>=2.1.0",
  "terminusdb-client>=10.2.6",
  "respx>=0.22.0",
  "trio>=0.32.0",
  "python-slugify>=8.0.4",
  "coverage>=7.13.4",
  "fastapi-cache2>=0.2.2",
  "redis>=7.4.0",
  "msgpack>=1.1.2",
]

[project.optional-dependencies]
test = ["pytest", "httpx", "pytest-asyncio"]

[tool.pytest.ini_options]
pythonpath = [".", "../vn_logger"]
testpaths = ["tests/unit", "tests/e2e"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "strict"
# Keep a single event loop for the whole test run so session-scoped async
# fixtures (e.g. Arango/aiohttp clients) aren't created on a different loop
# than the tests that use them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.uv]
dev-dependencies = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "vnoc-lsp-python",
]

[tool.uv.scripts]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

[tool.uv.sources]
vn-logger = { workspace = true }
vnoc-lsp-python = { workspace = true }
