[project]
name = "backend"
version = "0.1.0"
dependencies = [
  "fastapi",
  "uvicorn",
  "python-arango",
  "pydantic",
  "pydantic-settings",
  "pytest-mock>=3.14.1",
  "pathspec>=0.12.1",
  "astpretty>=3.0.0",
  "loguru>=0.7.3",
  "watchdog>=6.0.0",
  "fastapi-jsonrpc>=3.4.1",
  "vn-logger",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
test = ["pytest", "httpx", "pytest-asyncio"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit", "tests/e2e"]
python_files = ["test_*.py", "*_test.py"]

[tool.uv.scripts]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

[tool.uv.sources]
vn-logger = { workspace = true }
