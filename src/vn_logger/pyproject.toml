[project]
name = "vn-logger"
version = "0.1.1"
description = "Event and data logging service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["loguru>=0.7.3"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vn_logger"]
